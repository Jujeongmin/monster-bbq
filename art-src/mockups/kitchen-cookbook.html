<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주방 시안 · 도감</title>
<!-- Mock-up only (not the game): the evening kitchen's cookbook tab drawn with the new pixel UI kit
     (art-src/ui-kit-pixel/out). Fixed 1280x720 = the 640x360 game at --s 2. Kit art pixels are shown at
     2 game pixels (4 CSS px), icons and portraits at their game size. -->
<style>
  @font-face { font-family: "Galmuri11"; src: url("/fonts/Galmuri11.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Galmuri11"; src: url("/fonts/Galmuri11-Bold.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Galmuri9"; src: url("/fonts/Galmuri9.woff2") format("woff2"); }
  :root { --k: 4px; --ink: #3a2414; --ink-soft: #7a5a3e; --cream: #fff3d8; --brass: #ffd166; }
  html, body { margin: 0; background: #0b0b12; }
  * { box-sizing: border-box; image-rendering: pixelated; -webkit-font-smoothing: none; }
  .frame { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: "Galmuri11", monospace; font-size: 24px; color: var(--ink); }
  .bg { position: absolute; inset: 0; width: 1280px; height: 720px; }
  .dim { position: absolute; inset: 0; background: rgb(14 8 5 / 0.55); }
  .slice { border-style: solid; border-color: transparent; }
  .plate { position: absolute; left: 24px; top: 20px; height: 52px; padding: 0 28px; display: flex; align-items: center;
    border-width: calc(4 * var(--k)); border-image: url("../ui-kit-pixel/out/plate.png") 4 fill / calc(4 * var(--k)) stretch;
    font-weight: 700; color: #4a2a12; }
  .plate span { margin: 0 -16px; }
  .top { position: absolute; right: 24px; top: 26px; height: 36px; display: flex; gap: 24px; align-items: center; padding: 0 12px;
    border-width: calc(3 * var(--k)) calc(5 * var(--k)); border-image: url("../ui-kit-pixel/out/topbar.png") 3 5 fill / calc(3 * var(--k)) calc(5 * var(--k)) stretch;
    color: var(--cream); }
  .top span { display: inline-flex; align-items: center; gap: 8px; margin: -12px 0; }
  .top img { width: 44px; }
  .tabs { position: absolute; left: 40px; top: 88px; display: flex; gap: 8px; z-index: 2; }
  .tab { width: 152px; height: 56px; display: flex; align-items: center; justify-content: center;
    border-width: calc(4 * var(--k)); font-weight: 700; }
  .tab span { margin: -10px -16px -6px; }
  .tab.on { border-image: url("../ui-kit-pixel/out/tab_on.png") 4 fill / calc(4 * var(--k)) stretch; color: var(--ink); }
  .tab.off { border-image: url("../ui-kit-pixel/out/tab_off.png") 4 fill / calc(4 * var(--k)) stretch; color: #d8c4a4; }
  .panel { position: absolute; left: 24px; top: 136px; width: 1232px; height: 500px; padding: 8px;
    border-width: calc(5 * var(--k)); border-image: url("../ui-kit-pixel/out/panel.png") 5 fill / calc(5 * var(--k)) stretch; }
  .count { position: absolute; right: 28px; top: -2px; color: var(--brass); font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 16px; row-gap: 30px; margin-top: 30px; }
  .card { position: relative; height: 176px; display: flex; flex-direction: column; align-items: center; padding: 0 4px;
    border-width: calc(3 * var(--k)); border-image: url("../ui-kit-pixel/out/card.png") 3 fill / calc(3 * var(--k)) stretch; }
  .card > * { margin-top: -4px; }
  .dish { width: 84px; height: 80px; }
  .sil { filter: brightness(0); opacity: 0.32; }
  .name { font-weight: 700; margin-top: 2px; }
  .unknown { color: var(--ink-soft); }
  .shape { font-family: "Galmuri9", monospace; font-size: 20px; color: var(--ink-soft); }
  .lv { position: absolute; right: -8px; top: -8px; width: 112px; height: 44px; display: flex; align-items: center; justify-content: center;
    border-width: calc(3 * var(--k)) calc(6 * var(--k)); border-image: url("../ui-kit-pixel/out/ribbon.png") 3 6 fill / calc(3 * var(--k)) calc(6 * var(--k)) stretch;
    color: var(--cream); font-weight: 700; margin: 0; }
  .lv span { margin: -12px -24px; }
  .slots { display: flex; gap: 6px; margin-top: 6px; }
  .slot { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; color: #b89a74; font-weight: 700;
    border-width: calc(3 * var(--k)); border-image: url("../ui-kit-pixel/out/slot.png") 3 fill / calc(3 * var(--k)) stretch; }
  .slot img { width: 42px; margin: -12px; }
  .slot span { margin: -12px; }
  .btn { height: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; font-weight: 700; color: var(--cream);
    border-width: calc(3 * var(--k)) calc(4 * var(--k)); border-image: url("../ui-kit-pixel/out/btn_normal.png") 3 4 fill / calc(3 * var(--k)) calc(4 * var(--k)) stretch;
    text-shadow: 2px 2px 0 #4a1408; }
  .btn span { margin: -12px -8px; }
  .card .btn { position: absolute; bottom: -30px; width: 236px; margin: 0; }
  .ready { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: 320px; height: 52px; font-size: 24px; }
  .lid { position: absolute; left: 6px; bottom: -6px; width: 240px; z-index: 3; }
  .say { position: absolute; left: 230px; bottom: 96px; width: 420px; min-height: 80px; padding: 4px 8px; z-index: 3;
    border-width: calc(3 * var(--k)) calc(3 * var(--k)) calc(7 * var(--k)) calc(8 * var(--k));
    border-image: url("../ui-kit-pixel/out/bubble.png") 3 3 7 8 fill / calc(3 * var(--k)) calc(3 * var(--k)) calc(7 * var(--k)) calc(8 * var(--k)) stretch; }
  .say span { display: block; margin: -8px -16px -12px -20px; line-height: 1.5; }
</style>
</head>
<body>
<div class="frame">
  <img class="bg" src="../pixellab/shop2/bg_320_faithful.png" alt="">
  <div class="dim"></div>

  <div class="plate slice"><span>할매 돌판집 · 저녁 주방</span></div>
  <div class="top slice">
    <span><img src="../../art/test/ui/icon_day.png" alt="">2일째</span>
    <span><img src="../../art/test/ui/icon_gold.png" alt="">500</span>
  </div>

  <div class="tabs">
    <div class="tab on slice"><span>도감</span></div>
    <div class="tab off slice"><span>메뉴판</span></div>
    <div class="tab off slice"><span>강화</span></div>
    <div class="tab off slice"><span>도시락</span></div>
  </div>

  <div class="panel slice">
    <div class="count">연 요리 2/8</div>
    <div class="grid">
      <div class="card slice">
        <div class="lv slice"><span>Lv 2</span></div>
        <img class="dish" src="../../art/test/dishes/grilled_belly.png" alt="">
        <div class="name">삼겹살 구이</div>
        <div class="slots"><div class="slot slice"><img src="../../art/test/items/icon_boar_belly.png" alt=""></div></div>
      </div>
      <div class="card slice">
        <div class="lv slice"><span>Lv 1</span></div>
        <img class="dish" src="../../art/test/dishes/shiitake_grill.png" alt="">
        <div class="name">표고구이</div>
        <div class="slots"><div class="slot slice"><img src="../../art/test/items/icon_shiitake.png" alt=""></div></div>
      </div>
      <div class="card slice">
        <img class="dish sil" src="../../art/test/dishes/garlic_neck.png" alt="">
        <div class="shape">재료 2개 · 굽기</div>
        <div class="slots">
          <div class="slot slice"><img src="../../art/test/items/icon_boar_neck.png" alt=""></div>
          <div class="slot slice"><img src="../../art/test/items/icon_wild_garlic.png" alt=""></div>
        </div>
        <div class="btn slice"><span>연구 · 250골드</span></div>
      </div>
      <div class="card slice">
        <img class="dish sil" src="../../art/test/dishes/belly_ssam.png" alt="">
        <div class="shape">재료 3개 · 굽기</div>
        <div class="slots">
          <div class="slot slice"><img src="../../art/test/items/icon_boar_belly.png" alt=""></div>
          <div class="slot slice"><span>?</span></div>
          <div class="slot slice"><img src="../../art/test/items/icon_wild_garlic.png" alt=""></div>
        </div>
      </div>
      <div class="card slice">
        <img class="dish sil" src="../../art/test/dishes/honey_rabbit.png" alt="">
        <div class="shape">재료 2개 · 굽기</div>
        <div class="slots"><div class="slot slice"><span>?</span></div><div class="slot slice"><span>?</span></div></div>
      </div>
      <div class="card slice">
        <img class="dish sil" src="../../art/test/dishes/rib_stew.png" alt="">
        <div class="shape">재료 2개 · 끓이기</div>
        <div class="slots"><div class="slot slice"><span>?</span></div><div class="slot slice"><img src="../../art/test/items/icon_shiitake.png" alt=""></div></div>
      </div>
      <div class="card slice">
        <img class="dish sil" src="../../art/test/dishes/baeksuk.png" alt="">
        <div class="shape">재료 3개 · 끓이기</div>
        <div class="slots"><div class="slot slice"><span>?</span></div><div class="slot slice"><img src="../../art/test/items/icon_wild_garlic.png" alt=""></div><div class="slot slice"><img src="../../art/test/items/icon_shiitake.png" alt=""></div></div>
      </div>
      <div class="card slice">
        <img class="dish sil" src="../../art/test/dishes/chicken_perilla.png" alt="">
        <div class="shape">재료 2개 · 무치기</div>
        <div class="slots"><div class="slot slice"><span>?</span></div><div class="slot slice"><span>?</span></div></div>
      </div>
    </div>
  </div>

  <img class="lid" src="../../art/test/lid/smug.png" alt="">
  <div class="say slice"><span>깻잎은 숲에서 줍껑. 잘 안 보이면 E를 눌러 보껑.</span></div>

  <div class="btn ready slice"><span>장사 시작</span></div>
</div>
</body>
</html>
